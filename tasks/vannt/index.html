<!DOCTYPE html>

<head>

    <title>Nguyễn Thanh Vân - Trang Cá Nhân</title>
    <!-- Đường dẫn lùi 2 cấp về file CSS dùng chung -->
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

    <!-- Thêm class "theme-gray" để áp dụng tone màu xám -->
    <main class="profile-container theme-gray">
        <!-- Nút quay lại trang chủ -->
        <a href="../../index.html" class="back-link">&larr; Quay lại trang chủ</a>

        <div class="profile-card">
            <!-- Ảnh đại diện và Họ tên -->
            <header class="profile-header">
                <img src="avatar.jpg" alt="Nguyễn Thanh Vân" class="profile-avatar">
                <h1>Nguyễn Thanh Vân</h1>
            </header>

            <!-- Thông tin cá nhân -->
            <section class="profile-section">
                <h2>Thông tin cá nhân</h2>
                <div class="info-grid">
                   <p><span>MSSV:</span> 24106689</p>
                    <p><span>Lớp:</span> FIDT3.2410.2</p> 
                    <p><span>Ngành:</span> Thương mại điện tử</p> 
                    <p><span>Ngày sinh:</span> 04/06/2006</p>
                    <p><span>Giới tính:</span> Nữ</p>
                </div>
            </section>

            <!-- Sở thích -->
            <section class="profile-section">
                <h2>Sở thích</h2>
                <ul>
                    <li>Nghe nhạc</li>
                    <li>Vận động</li>
                    <li>Du lịch</li>
                </ul>
            </section>

            <!-- Sở trường -->
            <section class="profile-section">
                <h2>Sở trường</h2>
                <p> Kỹ năng làm việc nhóm. </p>

            </section>
        </div>
    </main>

</body>
